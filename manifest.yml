---
name: ghshield
version: 1.1.0
authors:
  - Nipun Kumar Goswami (ALVA)
description: >
  Freeze parts of a Grasshopper definition so nobody can move, delete, copy
  or edit them - while they keep solving and feeding everything downstream.

  Made for handing a definition to a client, consultant or fabricator: they
  run it and change the inputs you left open, and your logic stays exactly
  as you built it. Protection is saved in the .gh file.

  How to use: right-click any component and choose "Freeze with GHShield".
  Right-click a group to freeze the whole group. Right-click empty canvas to
  freeze or unfreeze a selection. Ctrl+Shift+F toggles the selection. Frozen
  objects show a frost wash and a padlock.

  Works on standard Grasshopper components and on components from other
  plugins - nothing needs replacing.

  Rhino 7 and Rhino 8, Windows.

  Note: this is protection, not encryption. Anyone with GHShield installed
  can unfreeze. It stops accidents and casual edits, not a determined person.

url: https://github.com/kgxo/GHShield
icon: ShieldIcon48.png

keywords:
  - protection
  - freeze
  - lock
  - read-only
  - collaboration
  - handover
