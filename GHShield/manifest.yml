name: ghshield
version: 1.0.0
authors:
  - Nipun
description: >
  Protection and access control for Grasshopper definitions.

  Freeze any object in a definition and it keeps solving and feeding
  everything downstream, but can no longer be moved, deleted, copied or
  edited. Protection is saved into the .gh file, so a definition stays
  locked when you send it to a client, a consultant or a fabricator.

  Works on the standard Grasshopper components you already use - nothing
  needs replacing. Protection adapters are generated at runtime, so
  third-party components are covered too.

  GHShield is not encryption. Anyone with GHShield installed can unfreeze,
  and the logic remains readable as ordinary components. It prevents
  accidents and casual meddling, not a determined person.

